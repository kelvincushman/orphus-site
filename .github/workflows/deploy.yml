name: Deploy

# Builds the site and uploads it to Cloudflare Pages.
#
# Until this existed, nothing deployed. The Pages project is a **Direct Upload**
# project, not a Git-connected one: `gh api repos/kelvincushman/orphus-site/deployments`
# returned an empty list, and Cloudflare's Git integration always registers a
# GitHub Deployment when it is connected. So every commit since the project was
# first uploaded — including ed66dc5, which removed a "v2.1 coming soon" banner
# that was a month stale — sat in main and never reached orphus.dev.
#
# That is the same failure shape ed66dc5 described in sync-repo.mjs: a step
# nothing owned, failing silently, looking exactly like a step that ran. The fix
# is the same too — put it in the repository where it is visible and versioned,
# rather than in a dashboard toggle nobody can read from a checkout.
#
# Setup required once, because a Direct Upload project cannot be deployed to
# without a credential this repository does not have:
#
#   1. Cloudflare dashboard -> Manage Account -> Account API Tokens -> Create Token
#      Template "Edit Cloudflare Workers", or a custom token with:
#        Account | Cloudflare Pages | Edit
#   2. gh secret set CLOUDFLARE_API_TOKEN  --repo kelvincushman/orphus-site
#      gh secret set CLOUDFLARE_ACCOUNT_ID --repo kelvincushman/orphus-site
#
# Without CLOUDFLARE_API_TOKEN the job reports what is missing and exits 0
# rather than failing every push with a red X that says nothing useful.
#
# This deploys exactly what is committed. `npm run sync` stays a deliberate
# step — the site mirrors the harness repo, and a deploy that silently re-mirrored
# would make the deployed page and the reviewed page two different things.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  # Matches the subdomain the project already serves: orphus-site.pages.dev
  PAGES_PROJECT: orphus-site
  # Pinned: an unversioned wrangler resolves to @latest, which floats the
  # toolchain of a published artifact with no diff to show for it.
  WRANGLER_VERSION: "4.135.0"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # A built site that never leaves the runner is the bug this file exists to
      # fix, so say so out loud rather than skipping quietly.
      - name: Check for the deploy credential
        id: cred
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN}" ] || [ -z "${ACCOUNT}" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Site built, not deployed"
              echo
              echo "\`CLOUDFLARE_API_TOKEN\` or \`CLOUDFLARE_ACCOUNT_ID\` is not set on this repository,"
              echo "so there is no way to upload to the \`${PAGES_PROJECT}\` Pages project."
              echo
              echo "Set both and re-run this workflow — see the header of \`.github/workflows/deploy.yml\`."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.cred.outputs.present == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes "wrangler@${WRANGLER_VERSION}" pages deploy dist \
            --project-name "${PAGES_PROJECT}" \
            --branch main \
            --commit-dirty=true

      - name: Confirm what is live
        if: steps.cred.outputs.present == 'true'
        run: |
          set -euo pipefail
          # Assert against the version this build actually carries, read from the
          # synced metadata — hardcoding a number here would pass for one release
          # and then quietly measure nothing.
          expected="$(node -p "require('./src/content/repo/meta.json').latestRelease")"
          echo "expecting ${expected} to be live"
          # The deploy is only real if the origin serves it. Pages fronts the
          # project with its own cache, so retry rather than asserting once.
          for i in $(seq 1 10); do
            body="$(curl -fsSL "https://${PAGES_PROJECT}.pages.dev" || true)"
            if printf '%s' "$body" | grep -qF "$expected"; then
              echo "live: ${PAGES_PROJECT}.pages.dev is serving ${expected}"
              exit 0
            fi
            sleep 15
          done
          echo "Deployed, but ${PAGES_PROJECT}.pages.dev did not show ${expected} within 150s." >&2
          echo "Check the custom domain is attached to this project's production branch." >&2
          exit 1
